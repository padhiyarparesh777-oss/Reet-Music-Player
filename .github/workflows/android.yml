name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.14.3
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip \
            -o /tmp/gradle-8.14.3-bin.zip
          unzip -q /tmp/gradle-8.14.3-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.14.3/bin/gradle" --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
