name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
          key: reet-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', 'settings.gradle.kts') }}
          restore-keys: |
            reet-gradle-${{ runner.os }}-

      - name: Install Gradle 8.14.3
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gradle-download"
          if ! curl -fL --retry 3 --retry-delay 4 --retry-all-errors \
            https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip \
            -o "$HOME/gradle-download/gradle.zip"; then
            curl -fL --retry 3 --retry-delay 4 --retry-all-errors \
              https://repo.huaweicloud.com/gradle/gradle-8.14.3-bin.zip \
              -o "$HOME/gradle-download/gradle.zip"
          fi
          unzip -q "$HOME/gradle-download/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.14.3/bin/gradle" --version

      - name: Install Android 16 SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --max-workers=2 :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reet-android-16-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
